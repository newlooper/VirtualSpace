name: build-and-sign

on:
  workflow_dispatch:
    inputs:
      signing_policy:
        description: SignPath signing policy slug
        type: choice
        options:
          - test-signing
          - release-signing
        default: test-signing
      version:
        description: Optional fixed version (e.g. 1.0.1706.101). Leave empty to use AutoVersion.tt defaults
        type: string
        required: false
        default: ''

  push:
    branches:
      - 1.0
      - 'release/**'
    tags:
      - 'Build-*'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build_and_sign:
    runs-on: windows-latest

    env:
      TARGET_FRAMEWORK: net10.0-windows
      DEFINE_CONSTANTS: NET10_0
      PROJECT: VirtualSpace/VirtualSpace.csproj
      # Prefer workflow_dispatch choice; on push use release-signing only for main/release/*
      SIGNPATH_POLICY: >-
        ${{
          github.event_name == 'workflow_dispatch'
            && inputs.signing_policy
            || (
                 (github.ref == 'refs/heads/1.0' || startsWith(github.ref, 'refs/heads/release/'))
                   && 'release-signing'
                   || 'test-signing'
               )
        }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # VirtualSpace embeds prebuilt VirtualDesktop*.dll from these Release outputs
      - name: Build VirtualDesktop assemblies
        shell: pwsh
        run: |
          $projects = @(
            'VirtualDesktop/VirtualDesktop10/VirtualDesktop10.csproj'
            'VirtualDesktop/VirtualDesktop11/VirtualDesktop11.csproj'
            'VirtualDesktop/VirtualDesktop11_21H2/VirtualDesktop11_21H2.csproj'
            'VirtualDesktop/VirtualDesktop11_23H2/VirtualDesktop11_23H2.csproj'
            'VirtualDesktop/VirtualDesktop11_23H2_3085/VirtualDesktop11_23H2_3085.csproj'
            'VirtualDesktop/VirtualDesktop11_24H2/VirtualDesktop11_24H2.csproj'
          )
          foreach ($p in $projects) {
            dotnet build $p -c Release -f $env:TARGET_FRAMEWORK
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # AutoVersion.cs is produced from AutoVersion.tt.
      # Important: generate it BEFORE dotnet publish. SDK-style projects evaluate **/*.cs
      # globs at the start of the build; if AutoVersion.cs is only created in BeforeBuild,
      # it exists on disk afterwards but was never compiled — EXE then has empty version info.
      # Optional workflow_dispatch "version" patches AutoVersion.tt variables first.
      - name: Publish VirtualSpace (single-file, framework-dependent)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ide = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.TextTemplating -property installationPath
          if (-not $ide) {
            throw 'Visual Studio with Text Templating not found on runner (needed by csproj TextTransform).'
          }
          $env:DevEnvDir = Join-Path $ide 'Common7\IDE\'
          $textTransform = Join-Path $env:DevEnvDir 'TextTransform.exe'
          if (-not (Test-Path -LiteralPath $textTransform)) {
            throw "TextTransform.exe not found: $textTransform"
          }

          $tt = Join-Path $env:GITHUB_WORKSPACE 'VirtualSpace\AutoVersion.tt'
          $cs = Join-Path $env:GITHUB_WORKSPACE 'VirtualSpace\AutoVersion.cs'
          if (-not (Test-Path -LiteralPath $tt)) {
            throw "AutoVersion.tt not found: $tt"
          }

          $manualVersion = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $manualVersion = '${{ inputs.version }}'.Trim()
          }

          if ($manualVersion) {
            if ($manualVersion -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<build>\d+)\.(?<revision>\d+)$') {
              throw "Invalid version '$manualVersion'. Expected major.minor.build.revision (e.g. 1.0.1706.101)."
            }
            $major = $Matches['major']
            $minor = $Matches['minor']
            $build = $Matches['build']
            $revision = $Matches['revision']

            $content = Get-Content -Path $tt -Raw
            $content = [regex]::Replace($content, 'private const int MAJOR = \d+;', "private const int MAJOR = $major;")
            $content = [regex]::Replace($content, 'private const int MINOR = \d+;', "private const int MINOR = $minor;")
            $content = [regex]::Replace(
              $content,
              'private static readonly int DaysSinceProjectStarted = [^;]+;',
              "private static readonly int DaysSinceProjectStarted = $build;")
            $content = [regex]::Replace(
              $content,
              'private static readonly int MinutesSinceMidnight = [^;]+;',
              "private static readonly int MinutesSinceMidnight = $revision;")
            Set-Content -Path $tt -Value $content -NoNewline -Encoding utf8
            Write-Host "Patched AutoVersion.tt => MAJOR=$major MINOR=$minor DaysSinceProjectStarted=$build MinutesSinceMidnight=$revision"
          }
          else {
            Write-Host "Using AutoVersion.tt as-is"
          }

          # Generate AutoVersion.cs before publish so MSBuild includes it in Compile.
          Push-Location (Split-Path $tt -Parent)
          try {
            & $textTransform -out $cs $tt
            if ($LASTEXITCODE -ne 0) { throw "TextTransform failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $cs)) {
            throw "AutoVersion.cs was not generated by TextTransform: $cs"
          }
          Write-Host "----- AutoVersion.cs -----"
          Get-Content -LiteralPath $cs | ForEach-Object { Write-Host $_ }
          Write-Host "----- end AutoVersion.cs -----"

          # pubxml is gitignored (*.pubxml). Pass the same settings as CLI properties
          # instead of /p:PublishProfile=... (see Properties/PublishProfiles/net10.0-windows-WIN.pubxml).
          $publishDir = "bin\Release\$env:TARGET_FRAMEWORK\publish\win-x64\"
          dotnet clean $env:PROJECT -c Release -f $env:TARGET_FRAMEWORK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # File must already exist so the default Compile glob picks it up.
          dotnet publish $env:PROJECT `
            -c Release `
            -f $env:TARGET_FRAMEWORK `
            -r win-x64 `
            --self-contained false `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:PublishDir=$publishDir `
            
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate published EXE
        id: locate
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE `
            "VirtualSpace\bin\Release\$env:TARGET_FRAMEWORK\publish\win-x64\VirtualSpace.exe"
          if (-not (Test-Path $exe)) {
            throw "Published EXE not found: $exe"
          }
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          $desc = (Get-Item $exe).VersionInfo.FileDescription
          if ([string]::IsNullOrWhiteSpace($ver)) {
            throw "Published EXE has empty ProductVersion. AutoVersion.cs was likely not compiled into the assembly."
          }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Found $exe"
          Write-Host "ProductVersion=$ver"
          Write-Host "FileDescription=$desc"
          Write-Host "Signing policy: $env:SIGNPATH_POLICY"

      # upload-artifact defaults to wrapping files in a ZIP. SignPath's default PE
      # artifact config expects a raw .exe -> that mismatch often yields:
      #   "Invalid request to SignPath API"
      # Fix A (below): upload raw EXE with archive:false + skip-decompress:true
      # Fix B: keep ZIP upload, create a Zip+nested Artifact Configuration in SignPath,
      #        and set artifact-configuration-slug to that slug.
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-unsigned
          path: ${{ steps.locate.outputs.exe }}
          if-no-files-found: error
          retention-days: 5

      - name: Submit SignPath signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: VirtualSpace
          signing-policy-slug: test-signing # ${{ env.SIGNPATH_POLICY }}
          # Only needed if not using the project's default artifact configuration:
          artifact-configuration-slug: "single-exe"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/signed
          # NOTE: skip-decompress only affects how the *signed* download is saved,
          # not how the unsigned upload is interpreted.

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-${{ steps.locate.outputs.version }}-Signed
          path: ${{ github.workspace }}/signed
          if-no-files-found: error
          retention-days: 30

